# Render Infrastructure Blueprint Configuration (render.yaml)
# Enables 1-Click Free Deployment on Render (https://render.com)

services:
  # 1. Express Backend Web Service
  - type: web
    name: optm-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: optm-frontend
          property: url

  # 2. React Frontend Static Site
  - type: web
    name: optm-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
